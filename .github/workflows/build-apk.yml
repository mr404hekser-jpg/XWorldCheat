name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: gradle

    - name: Make Gradlew Executable
      run: chmod +x ./gradlew

    - name: Build Release APK
      run: ./gradlew clean assembleRelease
      env:
        ANDROID_HOME: ${{ android-home }}

    - name: Check APK Output
      run: |
        echo "[*] Checking APK output..."
        ls -lh app/build/outputs/apk/release/
        find app/build/outputs -name "*.apk" -type f

    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ~/keystore.jks
        ls -lh ~/keystore.jks

    - name: Sign APK
      run: |
        $ANDROID_HOME/build-tools/31.0.0/apksigner sign \
          --ks ~/keystore.jks \
          --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --out XWorldEscape-Cheat.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Verify Signed APK
      run: |
        ls -lh XWorldEscape-Cheat.apk
        file XWorldEscape-Cheat.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XWorldEscape-Cheat-APK
        path: XWorldEscape-Cheat.apk
        retention-days: 30

    - name: Print Build Summary
      if: always()
      run: |
        echo "========================================="
        echo "Build Summary"
        echo "========================================="
        echo "Status: SUCCESS"
        echo "APK: XWorldEscape-Cheat.apk"
        echo "Date: $(date)"
        echo "========================================="
