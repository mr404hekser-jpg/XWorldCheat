name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: gradle

    - uses: android-actions/setup-android@v3
      with:
        api-level: 31
        ndk-version: 21.4.7075529

    - run: chmod +x ./gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Check APK Output
      run: |
        ls -lh app/build/outputs/apk/release/
        find app/build/outputs -name "*.apk" -type f

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ~/keystore.jks

    - name: Sign APK
      run: |
        $ANDROID_HOME/build-tools/31.0.0/apksigner sign \
          --ks ~/keystore.jks \
          --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --out XWorldEscape-Cheat.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XWorldEscape-Cheat-APK
        path: XWorldEscape-Cheat.apk
        retention-days: 30
