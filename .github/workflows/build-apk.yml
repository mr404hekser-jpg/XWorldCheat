name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Build Release APK
      run: |
        gradle clean assembleRelease --gradle-user-home ~/.gradle
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Sign & Release
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ~/keystore.jks
        $ANDROID_HOME/build-tools/31.0.0/apksigner sign \
          --ks ~/keystore.jks \
          --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --out XWorldEscape-Cheat.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - uses: actions/upload-artifact@v4
      with:
        name: XWorldEscape-Cheat-APK
        path: XWorldEscape-Cheat.apk
        retention-days: 30
