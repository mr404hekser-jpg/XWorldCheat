name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 31
        ndk-version: 21.4.7075529

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ~/keystore.jks

    - name: Sign APK
      run: |
        $ANDROID_HOME/build-tools/31.0.0/apksigner sign \
          --ks ~/keystore.jks \
          --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --out app/build/outputs/apk/release/XWorldEscape-signed.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Zipalign APK
      run: |
        $ANDROID_HOME/build-tools/31.0.0/zipalign -v 4 \
          app/build/outputs/apk/release/XWorldEscape-signed.apk \
          app/build/outputs/apk/release/XWorldEscape-Cheat.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: XWorldEscape-Cheat-APK
        path: app/build/outputs/apk/release/XWorldEscape-Cheat.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/release/XWorldEscape-Cheat.apk
        body: |
          # X World Escape Master Cheat
          - Auto-detect killer location
          - Real-time overlay tracking
          - Anti-simulation bypass
          - Floating panel UI
          - One-click build & release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Release
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: app/build/outputs/

